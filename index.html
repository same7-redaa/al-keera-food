<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#16120E" />
    <meta name="keywords" content="مطعم الكيرة, مشويات الكيرة المحلة, طواجن الكيرة, كباب وكفتة المحلة, طاجن ورق عنب بالكوارع, طاجن عكاوي, حمام محشي المحلة, مطاعم المشحمة" />
    
    <!-- Instant Critical Asset Preload -->
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/bg-pattern.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/og-image.jpg" fetchpriority="high" />
    
    <!-- Open Graph / WhatsApp / Facebook Share Metadata (High-Impact & Clear) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="مطعم الكيرة - أصل المشويات والطواجن الفخار" />
    <meta property="og:description" content="أشهى مشويات الفحم، طواجن الفخار البلدي بالسمن الفلاحي، وصواني العزومات الملكية في المحلة الكبرى. تصفح المنيو واطلب الآن دليفري ساخن وسريع." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:secure_url" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="1280" />
    <meta property="og:image:alt" content="مطعم الكيرة - المحلة الكبرى" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:site_name" content="مطعم الكيرة" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="مطعم الكيرة - أصل المشويات والطواجن الفخار" />
    <meta name="twitter:description" content="أشهى مشويات الفحم، طواجن الفخار البلدي بالسمن الفلاحي، وصواني العزومات الملكية في المحلة الكبرى. تصفح المنيو واطلب الآن دليفري ساخن وسريع." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Arabic Fonts: Flat Jooza + Cairo & Tajawal fallbacks -->
    <link rel="stylesheet" type="text/css" href="https://www.fontstatic.com/f=flat-jooza" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

    <!-- Instant 0ms Critical Dark Splash Style (Zero White Flash) -->
    <style>
      html, body {
        background-color: #16120E !important;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #16120E;
        background-image: url('/bg-pattern.png');
        background-size: 500px auto;
        background-repeat: repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
      }
      #initial-loader img {
        width: 180px;
        height: auto;
        max-width: 80vw;
        object-contain: contain;
      }
    </style>

    <title>مطعم الكيرة</title>
  </head>
  <body style="background-color: #16120E; margin: 0;" class="font-arabic overflow-x-hidden antialiased">
    <div id="root">
      <!-- Instant Pre-Rendered Splash Screen before JS/React executes -->
      <div id="initial-loader">
        <img src="/logo.png" alt="مطعم الكيرة" fetchpriority="high" decoding="sync" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
